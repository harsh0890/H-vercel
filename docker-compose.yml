version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sys
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/sys
      - SPRING_REDIS_HOST=redis
      - ACCESS_KEY=${ACCESS_KEY}
      - ACCOUNT_ID=${ACCOUNT_ID}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - redis
      - mysql
    restart: unless-stopped

  deployment:
    build: ./deployment
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/sys
      - SPRING_REDIS_HOST=redis
      - ACCESS_KEY=${ACCESS_KEY}
      - ACCOUNT_ID=${ACCOUNT_ID}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/deployments:/tmp/deployments
    depends_on:
      - redis
      - mysql
    restart: unless-stopped

volumes:
  redis_data:
  mysql_data: 